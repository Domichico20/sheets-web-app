<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Google Sheets Manager</title>
  <link rel="preload" as="image" href="logo.png">
  <link rel="preload" as="image" href="https://raw.githubusercontent.com/Domichico20/sheets-web-app/main/logo.png">
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/Domichico20/sheets-web-app/main/1%20logo.png?v=12">
  <link rel="shortcut icon" type="image/png"
    href="https://raw.githubusercontent.com/Domichico20/sheets-web-app/main/1%20logo.png?v=12">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Domichico20/sheets-web-app/main/logo.png?v=6">





  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- speed: warm up API connections -->
  <link rel="preconnect" href="https://sheets.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://sheets.googleapis.com">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">



  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --app-primary: #1e40af;
      --app-primary-hover: #2563eb;
      --app-primary-dark: #1e3a8a;
      --app-accent: #0ea5e9;
      --app-surface: rgba(255, 255, 255, 0.97);
      --app-text: #0f172a;
      --app-muted: #64748b;
      --app-border: rgba(15, 23, 42, 0.1);
      --app-radius: 12px;
      --app-radius-lg: 16px;
      --app-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 28px rgba(15, 23, 42, 0.08);
      --notes-table-col: 40%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 20px;
      background-color: #f0f0f0;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    #loginSection {
      position: relative;
      z-index: 1;
    }

    header img.logo {
      max-width: 200px;
      height: auto;
    }

    body.app-bg .reminder-preview-panel,
    body.app-bg .expirations-panel {
      display: block;
    }

    body.app-bg #appSection {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 4px;
      position: relative;
      z-index: 1;
    }

    body.app-bg header {
      position: relative;
      z-index: 1;
    }

    body.app-bg {
      overflow-x: hidden;
    }

    .table-scroll-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      margin: 0 auto 12px;
      border-radius: 12px;
      border: 1px solid var(--app-border, #ccc);
      background: white;
    }

    body.app-bg #searchSection {
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: var(--app-radius-lg);
      box-shadow: var(--app-shadow);
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    body.app-bg .form-section {
      background: var(--app-surface);
      border: 1px solid var(--app-border);
      border-radius: var(--app-radius-lg);
      box-shadow: var(--app-shadow);
      padding: 12px 14px 14px;
    }

    body.app-bg #dataTable {
      box-shadow: var(--app-shadow);
      border: 1px solid var(--app-border);
    }

    .expirations-panel {
      display: none;
      width: 100%;
      max-width: 920px;
      margin: 0 auto 20px;
      padding: 16px 18px 14px;
    }

    .expirations-panel h3 {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--app-text);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .expirations-list {
      max-height: 320px;
      overflow-y: auto;
    }

    .exp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .exp-item:last-child {
      border-bottom: none;
    }

    .exp-item-main {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px 14px;
      font-size: 0.86rem;
      color: var(--app-text);
    }

    .exp-item-main .exp-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--app-muted);
      display: block;
      margin-bottom: 2px;
    }

    .exp-item-main .exp-date {
      font-weight: 700;
      color: var(--app-primary-dark);
      white-space: nowrap;
    }

    .exp-remove-btn {
      flex-shrink: 0;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: var(--app-radius);
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      min-height: 44px;
    }

    .exp-remove-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .exp-empty {
      color: var(--app-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 4px 0 8px;
    }

    @media (max-width: 640px) {
      .exp-item {
        flex-direction: column;
        align-items: stretch;
      }
      .exp-item-main {
        grid-template-columns: 1fr;
      }
      .exp-remove-btn {
        width: 100%;
      }
    }

    .reminder-preview-panel {
      display: none;
      position: static;
      width: 100%;
      max-width: 920px;
      margin: 0 auto 20px;
      font-size: 0.8125rem;
      -webkit-font-smoothing: antialiased;
    }

    .reminder-preview-row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 14px;
    }

    .rpc-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 20px rgba(15, 23, 42, 0.07);
      overflow: hidden;
    }

    .rpc-calendar-wrap {
      flex: 0 0 auto;
      width: min(300px, 38vw);
      min-width: 252px;
    }

    .rpc-calendar-wrap .reminder-mini-cal {
      padding: 16px 16px 14px;
    }

    .rpc-upcoming-wrap {
      flex: 1 1 auto;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      padding: 16px 0 14px;
    }

    .rpc-upcoming-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 0 18px 12px;
      padding: 0;
    }

    .rpc-upcoming-list {
      flex: 1;
      overflow-y: auto;
      max-height: 280px;
      padding: 0 10px 0 18px;
      margin-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(37, 99, 235, 0.35) transparent;
    }

    .rpc-upcoming-list::-webkit-scrollbar {
      width: 5px;
    }

    .rpc-upcoming-list::-webkit-scrollbar-thumb {
      background: rgba(37, 99, 235, 0.35);
      border-radius: 10px;
    }

    .rpc-cal-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .rpc-kicker {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #64748b;
      grid-column: 1;
    }

    .rpc-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      grid-column: 2;
    }

    .rpc-nav-btn {
      appearance: none;
      border: none;
      background: #f1f5f9;
      color: #334155;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .rpc-nav-btn:hover {
      background: #e0e7ff;
      color: #1e3a8a;
    }

    .rpc-month-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #0f172a;
      padding: 0 8px;
      min-width: 7.5rem;
      text-align: center;
      white-space: nowrap;
    }

    .reminder-mini-cal table {
      width: 100%;
      margin: 0;
      font-size: 0.75rem;
      border-collapse: separate;
      border-spacing: 4px;
      background: transparent;
      border-radius: 0;
      border: none;
    }

    .reminder-mini-cal thead th {
      text-align: center;
      padding: 8px 0 10px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #eff6ff;
      border: none;
    }

    .reminder-mini-cal tbody td {
      text-align: center;
      padding: 0;
      border: none;
      background: transparent;
    }

    .reminder-mini-cal td .rpc-day-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1;
      max-height: 36px;
      margin: 0 auto;
      border-radius: 8px;
      font-weight: 700;
      color: #0f172a;
      font-size: 0.8rem;
    }

    .reminder-mini-cal .rpc-day-muted .rpc-day-cell {
      color: #cbd5e1;
      font-weight: 500;
    }

    .reminder-mini-cal .cal-day-event .rpc-day-cell {
      box-shadow: inset 0 0 0 2px #2563eb;
      color: #1e3a8a;
      background: #f8fafc;
    }

    .reminder-mini-cal .cal-day-today .rpc-day-cell {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .reminder-mini-cal .cal-day-today.cal-day-event .rpc-day-cell {
      box-shadow:
        0 2px 8px rgba(37, 99, 235, 0.35),
        inset 0 0 0 2px rgba(191, 219, 254, 0.95);
    }

    .rpc-cal-foot {
      text-align: center;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }

    .reminder-preview-item {
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .reminder-preview-item:last-child {
      border-bottom: none;
    }

    .reminder-preview-item .rv-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: #0f172a;
      word-break: break-word;
      line-height: 1.35;
    }

    .reminder-preview-item .rv-meta {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 5px;
      line-height: 1.3;
    }

    .rpc-empty {
      margin: 0;
      padding: 8px 18px 16px;
      color: #64748b;
      font-size: 0.84rem;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .reminder-preview-panel {
        margin-left: 0;
        margin-right: 0;
      }

      .reminder-preview-row {
        flex-direction: column;
      }

      .rpc-calendar-wrap {
        width: 100%;
        min-width: 0;
        max-width: none;
      }

      .rpc-nav-btn {
        min-width: 44px;
        min-height: 44px;
      }

      .rpc-upcoming-title {
        margin-left: 14px;
        margin-right: 14px;
      }

      .rpc-upcoming-list {
        max-height: 220px;
        padding-left: 14px;
        padding-right: 8px;
      }

      .rpc-empty {
        padding-left: 14px;
        padding-right: 14px;
      }
    }

    /* Email/notes sizing is controlled in .form-section (single row) */

    h2 {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg,
          #003366, #0066CC, #3399FF, #ff3333, #ffa733, #9a9c21, #54cc25, #1a8371, #229ea7, #33b4ff, #339cff);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 10s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      h2 {
        animation: none;
      }
    }

    @keyframes gradientShift {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* --- Login section as a centered card --- */
    #loginSection {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      /* ⬅️ no vertical centering */
      padding: 8px 16px 40px;
      /* small top padding only */
      min-height: auto;
      /* ⬅️ remove forced height */
    }

    .login-card { margin-top: 4px; }

    .login-card {
      position: relative;
      width: min(420px, 92vw);
      padding: 28px 24px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
      backdrop-filter: blur(6px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(45deg,
          #FF0000, #FF7300, #FFFB00, #48FF00,
          #00FFD5, #002BFF, #FF00C8, #FF0000);
      background-size: 600%;
      filter: blur(14px);
      z-index: -1;
      opacity: .30;
      animation: glowRainbow 20s linear infinite;
    }

    .login-card .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 14px;
      color: #003366;
    }

    .inputbox { position: relative; margin: 12px 0 6px; }

    .inputbox input {
      width: 100%;
      padding: 14px 12px;
      font-size: 1rem; /* >=16px on most browsers => no iOS zoom */
      border: 1px solid #d6d6d6;
      border-radius: 12px;
      outline: none;
      background: #fff;
    }

    .inputbox label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #fff;
      padding: 0 6px;
      color: #666;
      pointer-events: none;
      transition: .18s ease;
    }

    .inputbox input:focus+label,
    .inputbox input:not(:placeholder-shown)+label {
      top: 0;
      font-size: .8rem;
      color: #003366;
    }

    /* ========= Shared glow animation ========= */
    @keyframes glowRainbow {
      0% { background-position: 0 0; }
      50% { background-position: 400% 0; }
      100% { background-position: 0 0; }
    }

    /* Unlock button base */
    #loginSection .unlock-btn {
      margin-left: 0;
      padding: 15px 40px;
      border: none;
      outline: none;
      cursor: pointer;
      position: relative;
      border-radius: 12px;
      background-color: #2952db;
      color: #FFF;
      font-size: 1.1rem;
      isolation: isolate;
      width: 100%;
      margin-top: 14px;
    }

    /* ====== Rest of your styles (unchanged) ====== */
    #searchSection {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    #searchSection input[type="text"] {
      flex: 0 0 50%;
      max-width: 600px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #d6d6d6;
      border-radius: 12px;
    }

    #searchSection button.search-btn,
    #searchSection button.add-reminder-btn {
      padding: 20px 40px;
      font-size: 1.25rem;
      margin-left: 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    #searchSection button.search-btn { background-color: #10b981; color: #fff; font-weight: 600; }
    #searchSection button.add-reminder-btn { background-color: var(--app-primary-dark); color: white; font-weight: 600; }
    #searchSection button.add-reminder-btn:hover { background-color: var(--app-primary); }

    .critical-btn { background-color: #fc933d; color: #fff; }
    .remove-alert-btn { background-color: #d93025; color: #fff; }

    .form-section {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      min-width: 0;
    }

    .form-section .form-group label {
      font-weight: 600;
      font-size: 0.72rem;
      line-height: 1.2;
      margin-bottom: 4px;
      white-space: nowrap;
      color: var(--app-muted);
    }

    .form-section .form-group input,
    .form-section .form-group select,
    .form-section .form-group textarea {
      box-sizing: border-box;
      width: 100%;
      height: 42px;
      min-height: 42px;
      max-height: 42px;
      padding: 8px 10px;
      font-size: 0.9rem;
      line-height: 1.25;
      border: 1px solid #d6d6d6;
      border-radius: var(--app-radius);
      background: #fff;
      color: var(--app-text);
      resize: none;
      overflow-y: auto;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .form-section .form-group textarea {
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      font-family: inherit;
    }

    .form-section .form-group textarea:focus {
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 120px;
      height: auto;
      min-height: 42px;
    }

    .form-section .fg-user { flex: 0 0 6.5rem; }
    .form-section .fg-pass { flex: 0 0 6.5rem; }
    .form-section .fg-email { flex: 2 1 16.2rem; min-width: 14.4rem; max-width: 19.8rem; }
    .form-section .fg-extend { flex: 0 0 9.75rem; min-width: 9.75rem; max-width: 11rem; }
    .form-section .fg-extend select {
      padding-right: 1.65rem;
      overflow: visible;
      text-overflow: clip;
    }
    .form-section .fg-phone { flex: 0 0 9.25rem; min-width: 9.25rem; }
    .form-section .fg-server { flex: 0 0 4.5rem; }
    .form-section .fg-autopay { flex: 0 0 5.25rem; }
    .form-section .fg-exp { flex: 0 0 8.75rem; }
    .form-section .fg-notes { flex: 1 1 18rem; min-width: 15rem; max-width: none; }

    .form-group input[type="date"] {
      min-height: 42px;
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: center; /* center the whole bar */
      margin: 20px 0;
    }

    .button-group.center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap; /* all buttons on one line */
    }
    .button-group.center button {
      padding: 14px 24px;
      font-size: 1rem;
    }

    /* If the screen is small, allow wrapping (optional) */
    @media (max-width: 700px) {
      .button-group.center {
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    .button-group { display: flex; gap: 10px; }
    .button-group button {
      padding: 20px 40px;
      font-size: 1.25rem;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .add-btn    { background-color: var(--app-primary-dark); }
    .edit-btn   { background-color: var(--app-primary-hover); }
    .clear-btn  { background-color: #059669; }
    .refresh-btn{ background-color: #eab308; color: #1e293b; }
    .delete-btn { background-color: #dc2626; }
    .undo-btn { background-color: #ea580c; }

    .table-pagination {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 16px auto 12px;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .table-page-btn {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background-color: #003366;
      color: white;
      min-height: 44px;
    }

    .table-page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .table-page-info {
      font-size: 0.92rem;
      color: #0f172a;
      font-weight: 600;
      text-align: center;
      min-width: min(100%, 280px);
    }

    @media (max-width: 768px) {
      .table-pagination {
        flex-direction: column;
        gap: 10px;
        padding: 0 4px;
      }
      .table-page-btn {
        width: 100%;
        max-width: 320px;
      }
    }

    #dataTable {
      margin: 0 auto;
      width: 100%;
      min-width: 0;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      background: white;
      border-radius: 0;
      overflow: hidden;
    }

    #dataTable th,
    #dataTable td {
      border: 1px solid #ccc;
      padding: 6px 5px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      font-size: 0.84rem;
    }

    #dataTable th:nth-child(1),
    #dataTable td:nth-child(1),
    #dataTable th:nth-child(2),
    #dataTable td:nth-child(2),
    #dataTable th:nth-child(3),
    #dataTable td:nth-child(3),
    #dataTable th:nth-child(4),

    #dataTable td.notes-td,

    #dataTable th.th-stack {

      line-height: 1.25;
      font-size: 0.82rem;
      padding: 8px 6px;
    }

    #dataTable th {

      color: white;
      font-weight: 600;
    }
    tr.selected { background-color: rgb(238, 217, 217); }

    /* ========= SAME gradient glow for ALL buttons ========= */
    .button-group button,
    #searchSection .search-btn,
    #loginSection .unlock-btn {
      position: relative;
      isolation: isolate;
      z-index: 0;
    }

    .button-group button::before,
    #searchSection .search-btn::before,
    #loginSection .unlock-btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(45deg,
          #FF0000, #FF7300, #FFFB00, #48FF00,
          #00FFD5, #002BFF, #FF00C8, #FF0000);
      background-size: 600%;
      filter: blur(8px);
      animation: glowRainbow 20s linear infinite;
      transition: opacity .3s ease-in-out;
      opacity: 0;
      z-index: -1;
    }

    .button-group button:hover::before,
    #searchSection .search-btn:hover::before,
    #loginSection .unlock-btn:hover::before {
      opacity: 1;
    }

    /* --- Expiration date column (fits e.g. Sep 22, 2026) --- */
    #dataTable td:nth-child(7) {
      white-space: nowrap;
    }

    /* --- Notes column (centered card + scroll, shares table width) --- */
    #dataTable th.col-notes-header,
    #dataTable th:nth-child(8) {
      min-width: 0;
      text-align: center;
      letter-spacing: 0.02em;
    }

    #dataTable col.col-notes {
      width: var(--notes-table-col);
    }

    #dataTable td.notes-td {
      width: auto;
      min-width: 0;
      max-width: none;
      height: 12.5rem;
      padding: 10px 12px;
      vertical-align: middle;
      text-align: center;
      white-space: normal;
      overflow: hidden;
      background: #eef2ff;
    }

    #dataTable td.notes-td .notes-cell-wrap {
      display: block;
      width: 100%;
      height: calc(12.5rem - 20px);
      max-height: calc(12.5rem - 20px);
    }

    #dataTable td.notes-td .notes-cell {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 100%;
      box-sizing: border-box;
      margin: 0;
      overflow: auto;
      overscroll-behavior: contain;
      text-align: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #c7d2fe;
      box-shadow: 0 2px 8px rgba(30, 41, 59, 0.08);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #6366f1 #e0e7ff;
    }

    #dataTable td.notes-td .notes-cell::-webkit-scrollbar {
      width: 9px;
    }
    #dataTable td.notes-td .notes-cell::-webkit-scrollbar-track {
      background: #e0e7ff;
      border-radius: 8px;
      margin: 4px 0;
    }
    #dataTable td.notes-td .notes-cell::-webkit-scrollbar-thumb {
      background: #6366f1;
      border-radius: 8px;
    }

    #dataTable td.notes-td .notes-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 6rem;
      color: #94a3b8;
      font-size: 0.9rem;
      font-style: italic;
    }

    .note-entry {
      margin: 0 0 10px;
      padding: 0 4px 10px;
      text-align: center;
      border-bottom: 1px dashed #e2e8f0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .note-entry:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .note-entry .ts {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: #be123c;
      letter-spacing: 0.01em;
      margin-bottom: 5px;
    }
    .note-entry .txt {
      display: block;
      font-size: 0.9rem;
      line-height: 1.45;
      color: #334155;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      max-width: 100%;
    }

    /* 🔴 Critical alert highlight */
    .note-entry.critical {
      background: #d93025; /* Google red */
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: 6px 10px;
      display: block;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    @keyframes auroraSweep {

    /* "Ozzie" — margin safe zones only (2× per minute via JS) */
    @keyframes ozzieSurfaceOnce {
      0%, 100% {
        transform: translateX(-50%) translateY(78%);
        opacity: 0;
        filter: blur(14px) brightness(0.5);
        clip-path: inset(92% 0 0 0);
      }
      18% {
        transform: translateX(-50%) translateY(52%);
        opacity: 0.1;
        filter: blur(10px) brightness(0.68);
        clip-path: inset(68% 0 0 0);
      }
      32% {
        transform: translateX(-50%) translateY(22%);
        opacity: 0.28;
        filter: blur(3px) brightness(0.95);
        clip-path: inset(32% 0 0 0);
      }
      42% {
        transform: translateX(-50%) translateY(8%);
        opacity: 0.44;
        filter: blur(0) brightness(1.1);
        clip-path: inset(0 0 0 0);
      }
      52% {
        transform: translateX(-50%) translateY(18%);
        opacity: 0.26;
        filter: blur(2px) brightness(0.88);
        clip-path: inset(22% 0 0 0);
      }
      68% {
        transform: translateX(-50%) translateY(72%);
        opacity: 0;
        filter: blur(16px) brightness(0.45);
        clip-path: inset(94% 0 0 0);
      }
    }

    @keyframes ozzieWaterlineOnce {
      0%, 100% { opacity: 0; }
      28%, 55% { opacity: 0.6; }
      42% { opacity: 0.82; }
    }

    @keyframes ozzieRippleOnce {
      0%, 100% { transform: translateX(-50%) scale(0.55); opacity: 0; }
      38% { transform: translateX(-50%) scale(1); opacity: 0.32; }
      58% { transform: translateX(-50%) scale(1.25); opacity: 0; }
    }

    .ozzie-zone {
      position: fixed;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      visibility: hidden;
      opacity: 0;
    }

    .ozzie-zone.is-active {
      visibility: visible;
      opacity: 1;
    }

    /* Left margin (beside calendar) */
    .ozzie-zone-left {
      left: 0;
      top: clamp(92px, 13vh, 128px);
      width: clamp(64px, 10vw, 120px);
      height: clamp(220px, 36vh, 400px);
    }

    /* Top-left, under header beside logo */
    .ozzie-zone-top-left {
      left: clamp(64px, 10vw, 120px);
      top: clamp(52px, 8vh, 88px);
      width: clamp(60px, calc(50vw - 200px), 300px);
      height: clamp(44px, 6vh, 64px);
    }

    /* Top-right */
    .ozzie-zone-top-right {
      right: clamp(64px, 10vw, 120px);
      top: clamp(52px, 8vh, 88px);
      width: clamp(60px, calc(50vw - 200px), 300px);
      height: clamp(44px, 6vh, 64px);
    }

    /* Right margin (beside Upcoming) */
    .ozzie-zone-right {
      right: 0;
      top: clamp(92px, 13vh, 128px);
      width: clamp(64px, 10vw, 120px);
      height: clamp(220px, 36vh, 400px);
    }

    /* Strip under form row — side margins only on wide screens */
    .ozzie-zone-bottom {
      left: clamp(8px, 1.5vw, 20px);
      right: clamp(8px, 1.5vw, 20px);
      top: clamp(380px, 48vh, 520px);
      height: clamp(40px, 5vh, 56px);
      max-width: 100%;
    }

    @media (min-width: 1100px) {
      .ozzie-zone-bottom {
        left: clamp(64px, 10vw, 140px);
        right: clamp(64px, 10vw, 140px);
      }

  <script>
    /* ---------- Login background on first load ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('login-bg');
      initDOMCache(); // Initialize DOM cache for performance
      applyDailyAbstractBackground();
      scheduleDailyAbstractRefresh();
    });

    /* ---------- 365 daily abstract backgrounds (one per calendar day) ---------- */
    function abstractDayOfYear(d) {
      const date = d || new Date();
      const y = date.getFullYear();
      const start = Date.UTC(y, 0, 0);
      const today = Date.UTC(y, date.getMonth(), date.getDate());
      return Math.min(365, Math.max(1, Math.floor((today - start) / 86400000)));
    }

    function abstractRng(seed) {
      let s = seed >>> 0;
      return function next() {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function abstractPickHsl(rng) {
      return {
        h: Math.floor(rng() * 360),
        s: 58 + Math.floor(rng() * 34),
        l: 38 + Math.floor(rng() * 28)
      };
    }

    function abstractHsl(c, alpha) {
      if (alpha != null) return `hsla(${c.h},${c.s}%,${c.l}%,${alpha})`;
      return `hsl(${c.h},${c.s}%,${c.l}%)`;
    }

    function abstractOrganicRadius(rng) {
      const p = () => 28 + Math.floor(rng() * 44);
      return `${p()}% ${p()}% ${p()}% ${p()}% / ${p()}% ${p()}% ${p()}% ${p()}%`;
    }

    function applyDailyAbstractBackground() {
      const day = abstractDayOfYear();
      const rng = abstractRng(day * 9973 + 365);

      const bg = document.querySelector('.abstract-bg');
      if (!bg) return;
      bg.dataset.abstractDay = String(day);

      const layers = [];
      const blobCount = 6 + Math.floor(rng() * 3);
      for (let i = 0; i < blobCount; i++) {
        const x = 4 + Math.floor(rng() * 92);
        const y = 4 + Math.floor(rng() * 92);
        const ew = 40 + Math.floor(rng() * 55);
        const eh = 35 + Math.floor(rng() * 50);
        const alpha = 0.5 + rng() * 0.28;
        layers.push(
          `radial-gradient(ellipse ${ew}% ${eh}% at ${x}% ${y}%, ${abstractHsl(abstractPickHsl(rng), alpha)} 0%, transparent 54%)`
        );
      }

      const angle = Math.floor(rng() * 360);
      const g1 = abstractPickHsl(rng);
      const g2 = abstractPickHsl(rng);
      const g3 = abstractPickHsl(rng);
      const g4 = abstractPickHsl(rng);
      g1.l = Math.max(22, g1.l - 12);
      g4.l = Math.max(20, g4.l - 14);
      layers.push(
        `linear-gradient(${angle}deg, ${abstractHsl(g1)} 0%, ${abstractHsl(g2)} 30%, ${abstractHsl(g3)} 62%, ${abstractHsl(g4)} 100%)`
      );

      const base = abstractPickHsl(rng);
      base.l = 14 + Math.floor(rng() * 12);
      base.s = 45 + Math.floor(rng() * 35);
      bg.style.backgroundColor = abstractHsl(base);
      bg.style.backgroundImage = layers.join(', ');

      const wash = bg.querySelector('.abstract-static-colorwash');
      if (wash) {
        const from = Math.floor(rng() * 360);
        const seg = 7 + Math.floor(rng() * 3);
        const parts = [];
        for (let i = 0; i < seg; i++) {
          parts.push(abstractHsl(abstractPickHsl(rng), 0.11 + rng() * 0.14));
        }
        wash.style.background = `conic-gradient(from ${from}deg at 50% 50%, ${parts.join(', ')}, ${parts[0]})`;
      }

      const mesh = bg.querySelector('.abstract-static-mesh');
      if (mesh) {
        const a1 = 64 + Math.floor(rng() * 48);
        const a2 = 80 + Math.floor(rng() * 40);
        const d1 = 105 + Math.floor(rng() * 45);
        const d2 = -15 - Math.floor(rng() * 45);
        mesh.style.background =
          `repeating-linear-gradient(${d1}deg, transparent 0, transparent ${a1}px, rgba(255,255,255,0.04) ${a1}px, rgba(255,255,255,0.04) ${a1 + 1}px),` +
          `repeating-linear-gradient(${d2}deg, transparent 0, transparent ${a2}px, rgba(255,255,255,0.032) ${a2}px, rgba(255,255,255,0.032) ${a2 + 1}px)`;
      }

      const shapes = bg.querySelectorAll('.abstract-static-shapes .abs-shape');
      shapes.forEach((el, idx) => {
        const sr = abstractRng(day * 1009 + idx * 7919);
        el.classList.remove('abs-line');
        el.style.cssText = 'position:absolute;mix-blend-mode:screen;';

        if (idx >= 8) {
          el.classList.add('abs-line');
          el.style.mixBlendMode = 'normal';
          const cA = abstractPickHsl(sr);
          const cB = abstractPickHsl(sr);
          const cC = abstractPickHsl(sr);
          if (idx === 8) {
            el.style.width = '3px';
            el.style.height = (42 + Math.floor(sr() * 22)) + 'vh';
            el.style.top = Math.floor(sr() * 28) + '%';
            el.style.left = (8 + Math.floor(sr() * 84)) + '%';
            el.style.background = `linear-gradient(to bottom, transparent, ${abstractHsl(cA)}, ${abstractHsl(cB)}, transparent)`;
            el.style.opacity = String(0.4 + sr() * 0.25);
          } else {
            el.style.width = (28 + Math.floor(sr() * 38)) + 'vw';
            el.style.height = '3px';
            el.style.top = (15 + Math.floor(sr() * 65)) + '%';
            el.style.left = (5 + Math.floor(sr() * 55)) + '%';
            el.style.background = `linear-gradient(to right, transparent, ${abstractHsl(cA)}, ${abstractHsl(cB)}, ${abstractHsl(cC)}, transparent)`;
            el.style.opacity = String(0.35 + sr() * 0.28);
          }
          return;
        }

        const size = 16 + Math.floor(sr() * 40);
        el.style.width = `min(${size}vmax, ${size * 10}px)`;
        el.style.height = el.style.width;
        el.style.top = `${Math.floor(sr() * 78)}%`;
        if (sr() > 0.45) {
          el.style.left = `${Math.floor(sr() * 75)}%`;
          el.style.right = 'auto';
        } else {
          el.style.right = `${Math.floor(sr() * 35)}%`;
          el.style.left = 'auto';
        }
        el.style.borderRadius = abstractOrganicRadius(sr);
        const gradAng = Math.floor(sr() * 360);
        const useRadial = sr() > 0.55;
        if (useRadial) {
          el.style.background = `radial-gradient(circle, ${abstractHsl(abstractPickHsl(sr))} 0%, ${abstractHsl(abstractPickHsl(sr))} 42%, transparent 70%)`;
        } else {
          el.style.background = `linear-gradient(${gradAng}deg, ${abstractHsl(abstractPickHsl(sr))}, ${abstractHsl(abstractPickHsl(sr))} 52%, ${abstractHsl(abstractPickHsl(sr))})`;
        }
        el.style.transform = `rotate(${Math.floor(sr() * 56 - 28)}deg)`;
        el.style.opacity = String(0.38 + sr() * 0.28);
      });

      const grid = bg.querySelector('.abstract-static-grid');
      if (grid) {
        const gs = 40 + Math.floor(rng() * 28);
        grid.style.backgroundSize = `${gs}px ${gs}px`;
        grid.style.opacity = String(0.38 + rng() * 0.28);
      }

      const vig = bg.querySelector('.abstract-static-vignette');
      if (vig) {
        const v = abstractPickHsl(rng);
        v.l = 12 + Math.floor(rng() * 14);
        vig.style.background = `radial-gradient(ellipse 82% 76% at 50% 48%, transparent 40%, ${abstractHsl(v, 0.48)} 100%)`;
      }
    }

    function scheduleDailyAbstractRefresh() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1, 0);
      const ms = Math.max(1000, next - now);
      window.setTimeout(function onMidnight() {
        applyDailyAbstractBackground();
        scheduleDailyAbstractRefresh();
      }, ms);
    }

    /* ---------- App constants ---------- */
    const ROW_LIMIT = 25;
    let currentTablePage = 0;
    let currentTableRecords = [];
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzB8lRPMU0nZRSoU6CoRL_fcYstdq9pWPeZKdwuSp6O0QSsa95Oh49UnfV6uB9wt9w/exec';
    const sheetId = '1IR2TT4isrhET-3krSHV1BC8mE6xAhy0MEnR0h5-xBzs';
    const apiKey = 'AIzaSyC5rmJA1nl0LRhbGe-TsZwOSBfP97SzsHk';
    const range = 'data!A1:H3000';
    const SHEET_COL_COUNT = 8;
    const COL_AUTOPAY = 5;
    const COL_NOTES = 6;
    const COL_EXPIRATION = 7;

    function normalizeSheetRow(row) {
      const r = Array.isArray(row) ? row.slice() : [];
      while (r.length < SHEET_COL_COUNT) r.push('');
      return r.slice(0, SHEET_COL_COUNT);
    }

    function sheetSerialToMs(n) {
      if (typeof n !== 'number' || !isFinite(n)) return NaN;
      if (n < 20000 || n > 60000) return NaN;
      return Math.round((n - 25569) * 86400 * 1000);
    }

    function isExpirationColumnValue(cell) {
      if (cell == null || cell === '') return false;
      if (typeof cell === 'number') return !isNaN(sheetSerialToMs(cell));
      const s = String(cell).trim();
      if (!s) return false;
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return true;
      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) return true;
      if (/\b(AM|PM)\s*:\s*\S/i.test(s)) return false;
      if ((s.match(/:/g) || []).length >= 2 && !/^\d{4}-\d{2}-\d{2}/.test(s)) return false;
      if (s.length > 80) return false;
      return !isNaN(Date.parse(s));
    }

    function parseExpirationMs(cell) {
      if (cell == null || cell === '') return NaN;
      if (typeof cell === 'number') {
        const serial = sheetSerialToMs(cell);
        if (!isNaN(serial)) return serial;
      }
      if (!isExpirationColumnValue(cell)) return NaN;
      const s = String(cell).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
        const t = Date.parse(s.slice(0, 10) + 'T12:00:00');

      return isNaN(t) ? NaN : t;

    function applyExpirationToRow(row, expirationStr) {

      return r;

    function normalizeAutoPayDisplay(val) {
      const v = String(val || '').trim().toLowerCase();
      if (v === 'yes' || v === 'y') return 'Yes';
      if (v === 'no' || v === 'n') return 'No';
      return String(val || '').trim();

    let sessionPassword = "";

    // Undo functionality
    let undoStack = [];
    let maxUndoSteps = 10;
    
    function saveUndoState(action, data) {
      undoStack.push({

      });
      
      // Keep only last N undo steps
      if (undoStack.length > maxUndoSteps) {
        undoStack.shift();
      }
    }
    
    function undoLastChange() {
      if (undoStack.length === 0) {
        alert('No changes to undo');
        return;
      }
      
      const lastChange = undoStack.pop();
      
      switch (lastChange.action) {
        case 'add':
          alert('Cannot undo add operation automatically. Please delete the row manually.');
          break;
        case 'edit':
          if (lastChange.data && selectedRowIndex) {
            restoreRowData(lastChange.data);
            selectedRawNotes = lastChange.data.notes || '';

          } else {
            alert('Select a row first to restore.');

    function restoreRowData(data) {

    // Request cache to prevent duplicate API calls
    const requestCache = new Map();
    const CACHE_DURATION = 5000; // 5 seconds
    
    function getCachedRequest(url) {

    /* ---------- Helpers (formatting + search) ---------- */
    const TS_REGEX = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{1,2},\s\d{4},?\s\d{2}:\d{2}\s(?:AM|PM)/;

    function parseLastEditMs(notesCell) {
      if (!notesCell) return 0;
      const firstLine = String(notesCell).split('\n')[0].trim();
      const m = firstLine.match(TS_REGEX);
      if (!m) return 0;
      const ms = Date.parse(m[0]);
      return isNaN(ms) ? 0 : ms;
    }

    function escapeHTML(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function normalizePhone(s) {
      const d = (s || '').replace(/\D/g, '');
      if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3');
      if (d.length === 11 && d.startsWith('1'))
        return d.replace(/^1(\d{3})(\d{3})(\d{4})/, '1 ($1) $2-$3');
      return s || '';
    }

    function digitsOnly(s) { return (s || '').replace(/\D/g, ''); }

    function phoneLink(s) {
      const d = digitsOnly(s);
      if (!d) return '';
      const wa = (d.length === 10) ? ('1' + d) : (d.length === 11 && d.startsWith('1') ? d : d);
      const display = normalizePhone(s);
      return `<a href="https://wa.me/${wa}" target="_blank" rel="noopener" title="Message on WhatsApp">${escapeHTML(display)} 📲</a>`;
    }

    function canonicalEmail(s) {
      return (s || '')
        .toLowerCase()
        .replace(/^mailto:\s*/, '')
        .replace(/^mail\s*to:\s*/, '')
        .replace(/\s+/g, '')
        .trim();
    }

    function formatNotes(cell) {
      const stripped = (cell || '').replace(/#\d+:\s*/g, '').trim();
      if (!stripped) return '';

      const lines = stripped.split('\n');
      const criticalLines = [];
      const otherLines = [];

      lines.forEach(line => {
        const c = line.match(/^\[CRITICAL_ALERT\]\s*(.*)$/);
        if (c) {
          const msg = c[1] || '';
          criticalLines.push(`<div class="note-entry critical">CRITICAL ALERT: ${escapeHTML(msg)}</div>`);
        } else {
          const m = line.match(/^((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{1,2},\s\d{4},?\s\d{2}:\d{2}\s(?:AM|PM)):\s*(.*)$/);
          if (!m) otherLines.push(`<div class="note-entry"><span class="txt">${escapeHTML(line)}</span></div>`);
          else otherLines.push(`<div class="note-entry"><span class="ts">${escapeHTML(m[1])}</span><span class="txt">${escapeHTML(m[2])}</span></div>`);
        }
      });

      // Critical Alert always on top
      return criticalLines.join('') + otherLines.join('');
    }

    /* helper: show CRITICAL alert notification without auto-delete */
    function showCriticalAlert(rec) {
      const noteCell = (rec && rec.row && rec.row[COL_NOTES]) ? rec.row[COL_NOTES] : '';
      const m = (noteCell || '').match(/\[CRITICAL_ALERT\]\s*(.+)/);

      setTimeout(() => {
        alert(`⚠️ CRITICAL ALERT\n\n${message}\n\nThis alert will remain until manually removed.`);
      }, 100);
    }


    /* ---------- Data load + render ---------- */
    function renderTable(records){

      }
      if (domCache.expirationDate) domCache.expirationDate.value = expirationToInputValue(row[COL_EXPIRATION]);

      if (idxEl) idxEl.value = selectedRowIndex;

      // Show Critical Alert popup only when row is selected (not on Search)

  });

  domCache.tbody.appendChild(frag);
}

function getTablePageSlice(records) {
  const start = currentTablePage * ROW_LIMIT;
  return records.slice(start, start + ROW_LIMIT);
}

function updateTablePaginationUI(records) {
  const panel = document.getElementById('tablePagination');
  if (!panel) return;
  const total = records.length;
  const totalPages = Math.max(1, Math.ceil(total / ROW_LIMIT));
  if (currentTablePage >= totalPages) currentTablePage = Math.max(0, totalPages - 1);
  const prevBtn = document.getElementById('tablePrevPage');
  const nextBtn = document.getElementById('tableNextPage');
  const info = document.getElementById('tablePageInfo');
  if (prevBtn) prevBtn.disabled = currentTablePage <= 0;
  if (nextBtn) nextBtn.disabled = currentTablePage >= totalPages - 1 || total === 0;
  if (info) {
    if (total === 0) {
      info.textContent = 'No rows';
    } else {
      const from = currentTablePage * ROW_LIMIT + 1;
      const to = Math.min((currentTablePage + 1) * ROW_LIMIT, total);
      info.textContent = 'Page ' + (currentTablePage + 1) + ' of ' + totalPages + ' · rows ' + from + '–' + to + ' of ' + total;
    }
  }
  panel.style.display = total > 0 ? 'flex' : 'none';
}

function renderTablePage(records, resetPage) {
  if (resetPage !== false) currentTablePage = 0;
  currentTableRecords = Array.isArray(records) ? records : [];
  renderTable(getTablePageSlice(currentTableRecords));
  updateTablePaginationUI(currentTableRecords);
}

function tablePrevPage() {
  if (currentTablePage <= 0) return;
  currentTablePage--;
  renderTable(getTablePageSlice(currentTableRecords));
  updateTablePaginationUI(currentTableRecords);
}

function tableNextPage() {
  const totalPages = Math.ceil(currentTableRecords.length / ROW_LIMIT);
  if (currentTablePage >= totalPages - 1) return;
  currentTablePage++;
  renderTable(getTablePageSlice(currentTableRecords));
  updateTablePaginationUI(currentTableRecords);
}

window.tablePrevPage = tablePrevPage;
window.tableNextPage = tableNextPage;
window.renderTablePage = renderTablePage;

   // Tunables
const REFRESH_COLS = 'A:H';
const SHEET_TAB    = 'data';

// Safe busy helper (does nothing if not present)
function setBusySafe(sel, on) {
  const el = document.querySelector(sel);
  if (!el) return;
  el.disabled = !!on;
  el.style.opacity = on ? .6 : 1;
  el.style.pointerEvents = on ? 'none' : 'auto';
}

// Optimized sort helper with better performance
function sortByRecent(a, b) {
  // Use bitwise operations for faster comparison
  const timeDiff = b.lastEditMs - a.lastEditMs;
  return timeDiff !== 0 ? timeDiff : (b.sheetRow - a.sheetRow);
}

// Optimized sorting for large datasets
function sortRecords(records) {
  // Use native sort with optimized comparison
  return records.sort(sortByRecent);
}

// Build the inner <td> HTML for a row (column order matches table header, not raw sheet index order)
function tdHTML(rowArr) {
  const row = normalizeSheetRow(rowArr);
  const displayOrder = [0, 1, 2, 3, 4, COL_AUTOPAY, COL_EXPIRATION, COL_NOTES];
  const parts = [];
  displayOrder.forEach(ci => {
    const cell = row[ci] || '';
    if (ci === COL_NOTES) {
      const notesBody = formatNotes(cell);
      const inner = notesBody
        ? '<div class="notes-cell" tabindex="0" role="region" aria-label="Notes (scroll to read all)">' + notesBody + '</div>'
        : '<div class="notes-empty">No notes</div>';
      parts.push('<td class="notes-td"><div class="notes-cell-wrap">' + inner + '</div></td>');
    }
    else if (ci === COL_EXPIRATION) parts.push('<td>' + formatExpirationDisplay(cell) + '</td>');
    else if (ci === COL_AUTOPAY) parts.push('<td>' + escapeHTML(normalizeAutoPayDisplay(cell) || cell) + '</td>');
    else if (ci === 3) parts.push('<td class="phone-wa">' + phoneLink(cell) + '</td>');
    else parts.push('<td>' + escapeHTML(cell) + '</td>');
  });
  return parts.join('');
}


// Fetch and update a set of sheet rows via one batchGet
async function refreshRowsBatch(sheetRowNums) {
  if (!sheetRowNums.length) return;

  const ranges = sheetRowNums.map(r => `${SHEET_TAB}!${REFRESH_COLS.split(':')[0]}${r}:${REFRESH_COLS.split(':')[1]}${r}`);
  const qs = ranges.map(r => `ranges=${encodeURIComponent(r)}`).join('&');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchGet?${qs}&fields=valueRanges(range,values)&key=${apiKey}`;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const payload = await res.json();
  const list = (payload && payload.valueRanges) || [];

  // Map “A123:G123” -> 123
  const rowNumFromRange = (rng) => {
    const m = String(rng || '').match(/!.*?([A-Z]+)(\d+):/i);
    return m ? parseInt(m[2], 10) : null;
  };

  list.forEach(vr => {
    const rnum = rowNumFromRange(vr.range);
    if (!rnum) return;

    const row = (vr.values && vr.values[0]) ? vr.values[0] : [];
    const newRow = normalizeSheetRow(row);

    // update selected notes cache if applicable
    if (typeof selectedRowIndex === 'number' && rnum === selectedRowIndex) {
      selectedRawNotes = newRow[COL_NOTES] || '';
    }

    // upsert into allRecords - use timestamp from notes for correct sort order
    const lastEdit = parseLastEditMs(newRow[COL_NOTES] || '') || 0;
    let rec = allRecords.find(x => x.sheetRow === rnum);
    if (rec) {
      rec.row = newRow;
      rec.lastEditMs = lastEdit || rec.lastEditMs;
    } else {
      rec = {
        row: newRow,
        sheetRow: rnum,
        lastEditMs: lastEdit || Date.now()
      };
      allRecords.push(rec);
    }

    // update DOM cell contents if this row is currently rendered
    const tr = document.querySelector(`#dataTable tbody tr[data-row="${rnum}"]`);
    if (tr) tr.innerHTML = tdHTML(newRow);
  });
}

// Full reload (reduced payload using fields=values)
async function fullReload() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(range)}?fields=values&key=${apiKey}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();

  const rows = data.values || [];
  totalRows = rows.length;

  const dataRows = rows.slice(1); // skip header
  existingUsernames = dataRows.map(r => (r[0] || '').toLowerCase());

  allRecords = dataRows.map((row, idx) => {
    const normalized = normalizeSheetRow(row);
    return {
      row: normalized,
      sheetRow: idx + 2,
      lastEditMs: parseLastEditMs(normalized[COL_NOTES] || '')
    };
  });

  sortRecords(allRecords);

  if (domCache.searchQuery) domCache.searchQuery.value = '';
  if (domCache.password) domCache.password.value = '';
  if (domCache.tbody) domCache.tbody.innerHTML = '';

  renderTablePage(allRecords);
}

// === Optimized loader ===
// - onlySelected === true -> refresh selected row if any,
//   otherwise refresh all VISIBLE rows (no selection required).
// - onlySelected === false -> full reload (lightweight payload).
async function loadData(onlySelected = false) {
  // Clear form password input on Refresh (table row data stays)
  if (domCache.password) domCache.password.value = '';
  setBusySafe('#refreshBtn', true);

  try {
    if (onlySelected) {
      let targets = [];

      // If a row is selected, prefer that…
      if (Number.isInteger(selectedRowIndex)) {
        targets = [selectedRowIndex];
      } else {
        // …otherwise grab all rows currently rendered in the table
        targets = Array.from(document.querySelectorAll('#dataTable tbody tr'))
          .map(tr => parseInt(tr.dataset.row, 10))
          .filter(Boolean);
      }

      // Fallback to top chunk if table is empty (e.g., first load)
      if (targets.length === 0 && Array.isArray(allRecords) && allRecords.length) {
        targets = getTablePageSlice(allRecords).map(r => r.sheetRow);
      }

      if (targets.length) {
        await refreshRowsBatch(Array.from(new Set(targets)));
        // keep table sorted by latest change, then show top chunk (fast)
        sortRecords(allRecords);
        renderTablePage(allRecords, false);
        return;
      }
      // If we still have nothing, do a full reload.
    }

    await fullReload();
  } catch (err) {
    console.error(err);
    alert('Failed to load data from Google Sheets.');
  } finally {
    setBusySafe('#refreshBtn', false);
    renderReminderPreview();
    renderUpcomingExpirations();
  }
}

window.loadData = loadData;

const EXP_PANEL_DISMISS_KEY = 'contactsManagerExpPanelDismissed';

function getExpPanelDismissedRows() {

    const raw = JSON.parse(localStorage.getItem(EXP_PANEL_DISMISS_KEY) || '[]');
    if (!Array.isArray(raw)) return new Set();
    return new Set(raw.map(n => Number(n)).filter(n => Number.isFinite(n) && n > 0));
  } catch (e) {
    return new Set();
  }
}

function saveExpPanelDismissedRows(set) {
  localStorage.setItem(EXP_PANEL_DISMISS_KEY, JSON.stringify(Array.from(set)));
}

function removeExpirationFromPanel(sheetRow) {
  const rowNum = Number(sheetRow);
  if (!Number.isFinite(rowNum) || rowNum <= 0) return;
  if (!confirm('Remove this contact from Upcoming Expirations?\n\nThe row stays in your main table.')) return;
  const dismissed = getExpPanelDismissedRows();
  dismissed.add(rowNum);
  saveExpPanelDismissedRows(dismissed);
  renderUpcomingExpirations();
}

function renderUpcomingExpirations() {
  const list = document.getElementById('expirationsList');
  if (!list || !Array.isArray(allRecords)) return;
  const dismissed = getExpPanelDismissedRows();
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  const startMs = start.getTime();
  const endDay = new Date(start);
  endDay.setDate(endDay.getDate() + 7);
  endDay.setHours(23, 59, 59, 999);
  const endMs = endDay.getTime();
  const items = [];
  allRecords.forEach(rec => {
    if (dismissed.has(rec.sheetRow)) return;
    const row = normalizeSheetRow(rec.row);
    if (rowHasAutoPayYes(row)) return;
    const ms = parseExpirationMs(row[COL_EXPIRATION]);
    if (isNaN(ms) || ms < startMs || ms > endMs) return;
    items.push({
      sheetRow: rec.sheetRow,
      email: row[2] || '',
      phone: row[3] || '',
      expMs: ms,
      expDisplay: formatExpirationDisplay(row[COL_EXPIRATION])
    });
  });
  items.sort((a, b) => a.expMs - b.expMs);
  if (!items.length) {
    list.innerHTML = '<p class="exp-empty">No contacts expiring in the next 7 days without AutoPay. Set AutoPay to No (or leave blank), add an expiration date, and ensure the date falls within the next week.</p>';
    return;
  }
  list.innerHTML = items.map(it =>
    '<div class="exp-item">' +
    '<div class="exp-item-main">' +
    '<div><span class="exp-label">Email</span>' + escapeHTML(it.email || '—') + '</div>' +
    '<div><span class="exp-label">Phone</span>' + escapeHTML(it.phone || '—') + '</div>' +
    '<div><span class="exp-label">Expires</span><span class="exp-date">' + it.expDisplay + '</span></div>' +
    '</div>' +
    '<button type="button" class="exp-remove-btn" onclick="removeExpirationFromPanel(' + it.sheetRow + ')">Remove</button>' +
    '</div>'
  ).join('');
}

window.removeExpirationFromPanel = removeExpirationFromPanel;
window.renderUpcomingExpirations = renderUpcomingExpirations;

    /* ---------- Search (optimized with caching and debouncing) ---------- */
function searchData() {
  // Clear form input boxes when search is performed (table row data stays)
  if (domCache.username) domCache.username.value = '';
  if (domCache.password) domCache.password.value = '';
  if (domCache.email) domCache.email.value = '';
  if (domCache.phone) domCache.phone.value = '';
  if (domCache.server) domCache.server.value = '';
  if (domCache.autoPay) domCache.autoPay.value = '';
  if (domCache.expirationDate) domCache.expirationDate.value = '';
  if (domCache.notes) domCache.notes.value = '';
  
  const raw = domCache.searchQuery.value.trim().toLowerCase();
  if (!raw) { 
    renderTablePage(allRecords); 
    return; 
  }

  // Pre-compile regex patterns for better performance
  const qDigits = (raw.match(/\d/g) || []).join('');
  const qEmail = canonicalEmail(raw);
  const hasPhoneQuery = qDigits.length >= 7;
  const hasEmailQuery = qEmail.includes('@');

  // Use for loop instead of filter for better performance on large datasets
  const filtered = [];
  for (let i = 0; i < allRecords.length; i++) {
    const rec = allRecords[i];
    const row = rec.row;
    const baseMatch = row.join(' ').toLowerCase().includes(raw);

    let phoneMatch = false;
    if (hasPhoneQuery) {
      const rp = (row[3] || '').replace(/\D/g, '');
      const last10 = s => s.slice(-10);
      if (rp) phoneMatch = rp.includes(qDigits) || last10(rp) === last10(qDigits);
    }

    let emailMatch = false;
    if (hasEmailQuery) {
      const re = canonicalEmail(row[2] || '');

      function addExpirationPeriod(baseDate, code) {
        const d = new Date(baseDate.getTime());
        switch (code) {
          case '24h': d.setTime(d.getTime() + 86400000); break;
          case '48h': d.setTime(d.getTime() + 2 * 86400000); break;
          case '1m': d.setMonth(d.getMonth() + 1); break;
          case '3m': d.setMonth(d.getMonth() + 3); break;
          case '6m': d.setMonth(d.getMonth() + 6); break;
          case '1y': d.setFullYear(d.getFullYear() + 1); break;
          default: return d;
        }
        return d;
      }

        const y = d.getFullYear();

        return `${y}-${m}-${day}`;

    function reminderCalendarNav(which) {
      if (which === 'prevYear') reminderCalYear--;
      else if (which === 'nextYear') reminderCalYear++;
      else if (which === 'prevMonth') {
        reminderCalMonth--;
        if (reminderCalMonth < 0) { reminderCalMonth = 11; reminderCalYear--; }
      } else if (which === 'nextMonth') {
        reminderCalMonth++;
        if (reminderCalMonth > 11) { reminderCalMonth = 0; reminderCalYear++; }
      }

    function renderReminderPreview() {
      const calEl = document.getElementById('reminderPreviewCalendar');
      const listEl = document.getElementById('reminderPreviewList');
      if (!calEl || !listEl) return;

      let stored = [];
      try {
        stored = JSON.parse(localStorage.getItem(REMINDER_STORAGE_KEY) || '[]');
      } catch (e) { stored = []; }
      if (!Array.isArray(stored)) stored = [];

      /* Upcoming + calendar dots: localStorage reminders only (Add Reminder). Sheet Notes column is not read. */
      const merged = [];
      stored.forEach(r => {
        if (!r || r.completed || r.id == null) return;
        if (r.due != null && !isNaN(Number(r.due))) {
          merged.push({
            text: r.text || 'Reminder',
            due: Number(r.due),
            username: r.username || ''
          });
        } else if (r.text && String(r.text).trim()) {
          merged.push({
            text: r.text,
            due: null,
            username: r.username || ''
          });
        }
      });
      const horizonStart = new Date();
      horizonStart.setHours(0, 0, 0, 0);
      horizonStart.setDate(horizonStart.getDate() - 1);
      const minDue = horizonStart.getTime();
      const maxDue = minDue + 86400000 * 420;

      const withDue = merged.filter(x => x.due != null && !isNaN(x.due) && x.due >= minDue && x.due <= maxDue);
      const noDue = merged.filter(x => x.due == null || isNaN(x.due));
      withDue.sort((a, b) => a.due - b.due);
      noDue.sort((a, b) => String(a.text || '').localeCompare(String(b.text || '')));
      const active = withDue.concat(noDue);

      const now = new Date();
      const y = reminderCalYear;
      const mo = reminderCalMonth;
      const first = new Date(y, mo, 1);
      const lastDay = new Date(y, mo + 1, 0).getDate();
      const padStart = (first.getDay() + 6) % 7;
      const monthLabel = first.toLocaleString('en-US', { month: 'long', year: 'numeric' });

      const daySet = new Set();
      withDue.forEach(item => {
        const d = new Date(item.due);
        if (d.getFullYear() === y && d.getMonth() === mo) daySet.add(d.getDate());
      });

      let calHtml = '<div class="rpc-cal-head">';
      calHtml += '<span class="rpc-kicker">Calendar</span>';
      calHtml += '<div class="rpc-nav">';
      calHtml += '<button type="button" class="rpc-nav-btn" aria-label="Previous year" onclick="reminderCalendarNav(\'prevYear\')">«</button>';
      calHtml += '<button type="button" class="rpc-nav-btn" aria-label="Previous month" onclick="reminderCalendarNav(\'prevMonth\')">‹</button>';
      calHtml += '<span class="rpc-month-label">' + escapeHTML(monthLabel) + '</span>';
      calHtml += '<button type="button" class="rpc-nav-btn" aria-label="Next month" onclick="reminderCalendarNav(\'nextMonth\')">›</button>';
      calHtml += '<button type="button" class="rpc-nav-btn" aria-label="Next year" onclick="reminderCalendarNav(\'nextYear\')">»</button>';
      calHtml += '</div><span></span></div>';

      calHtml += '<table><thead><tr>';
      ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(function (d, i) {
        calHtml += '<th title="' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i] + '">' + d + '</th>';
      });
      calHtml += '</tr></thead><tbody><tr>';
      for (let i = 0; i < padStart; i++) calHtml += '<td class="rpc-day-muted"><span class="rpc-day-cell"></span></td>';

      const todayD = now.getDate();
      const todayM = now.getMonth();
      const todayY = now.getFullYear();
      let col = padStart;
      for (let day = 1; day <= lastDay; day++) {
        if (col === 7) { calHtml += '</tr><tr>'; col = 0; }
        const isToday = day === todayD && mo === todayM && y === todayY;
        const hasEvent = daySet.has(day);
        let cls = '';
        if (isToday) cls += ' cal-day-today';
        if (hasEvent) cls += ' cal-day-event';
        calHtml += '<td class="' + cls.trim() + '"><span class="rpc-day-cell">' + day + '</span></td>';
        col++;
      }
      while (col < 7) {
        calHtml += '<td class="rpc-day-muted"><span class="rpc-day-cell"></span></td>';
        col++;
      }
      calHtml += '</tr></tbody></table>';
      calHtml += '<div class="rpc-cal-foot">' + escapeHTML(monthLabel) + '</div>';
      calEl.innerHTML = calHtml;

      if (active.length === 0) {
        listEl.innerHTML = '<p class="rpc-empty">No reminders yet. Use Add Reminder to create one (a due date shows it on the calendar).</p>';
        return;
      }
      listEl.innerHTML = active.slice(0, 25).map(r => {

        return '<div class="reminder-preview-item"><div class="rv-title">' + title + '</div><div class="rv-meta">' + meta + '</div></div>';

      if (selectedRowIndex !== null) {
        const rec = allRecords.find(r => r.sheetRow === selectedRowIndex);
        username = rec && rec.row && rec.row[0] ? String(rec.row[0]).trim() : '';
      }
      if (!username && domCache.username) {
        username = domCache.username.value ? String(domCache.username.value).trim() : '';
      }
      if (!username) {
        alert('Select a row first: click on a row in the table, then click Add Reminder.');
        return;
      }
      const modal = document.getElementById('reminderModal');
      const userInput = document.getElementById('reminderUsername');
      const textInput = document.getElementById('reminderText');
      const dueInput = document.getElementById('reminderDue');
      if (userInput) userInput.value = username;
      if (textInput) textInput.value = '';
      if (dueInput) dueInput.value = '';
      renderUserReminders(username);
      if (modal) modal.classList.add('open');
    }

    function closeReminderModal() {
      const modal = document.getElementById('reminderModal');
      if (modal) modal.classList.remove('open');
    }

    function renderUserReminders(username) {
      const list = document.getElementById('userRemindersList');
      if (!list) return;
      const userReminders = reminders.filter(r =>
        (r.username || '').toLowerCase() === (username || '').toLowerCase() &&
        !r.alertShown
      );
      if (userReminders.length === 0) {
        list.innerHTML = '';
        return;
      }
      list.innerHTML = '<h4>Existing reminders for this user</h4>' +
        userReminders.map(r => '<span class="reminder-chip">' + escapeHTML(r.text) + (r.due ? ' (' + new Date(r.due).toLocaleDateString() + ')' : '') + '</span>').join('');
    }

    function saveReminderFromModal() {
      const username = (document.getElementById('reminderUsername') || {}).value || '';
      const text = (document.getElementById('reminderText') || {}).value.trim();
      const dueVal = (document.getElementById('reminderDue') || {}).value;
      if (!username) { alert('Username is required.'); return; }
      if (!text) { alert('Enter a reminder.'); return; }
      const due = dueVal ? new Date(dueVal).getTime() : null;
      reminders.push({
        id: Date.now(),
        username,
        text,
        due,
        completed: false,
        alertShown: false,
        createdAt: Date.now()
      });
      saveReminders();
      renderReminderPreview();
      closeReminderModal();
    }

    let currentReminderId = null;

    function showReminderNotification(reminder) {
      if (!reminder) return;
      currentReminderId = reminder.id;
      const sub = document.getElementById('reminderNotifSub');
      const userEl = document.getElementById('reminderNotifUser');
      const msg = document.getElementById('reminderNotifMsg');
      const overlay = document.getElementById('reminderNotification');
      if (sub) sub.textContent = 'Due: ' + new Date(reminder.due).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      if (userEl) {
        userEl.textContent = reminder.username ? 'For: ' + reminder.username : '';
        userEl.style.display = reminder.username ? 'inline-block' : 'none';
      }
      if (msg) msg.textContent = reminder.text || 'Reminder';
      if (overlay) overlay.classList.add('open');
    }

    function closeReminderNotification() {
      const overlay = document.getElementById('reminderNotification');
      if (overlay) overlay.classList.remove('open');
      currentReminderId = null;
    }

    function handleReminderAction(action) {
      if (!currentReminderId) { closeReminderNotification(); return; }
      try {
        let stored = JSON.parse(localStorage.getItem(REMINDER_STORAGE_KEY) || '[]');
        const idx = stored.findIndex(r => r.id === currentReminderId);
        if (idx === -1) { closeReminderNotification(); return; }
        const r = stored[idx];
        const now = Date.now();
        if (action === 'done') {
          stored = stored.filter(x => x.id !== currentReminderId);
        } else {
          const mins = { snooze30: 30, snooze60: 60, snooze360: 360, snooze1440: 1440 }[action] || 30;
          r.due = now + mins * 60 * 1000;
          r.alertShown = false;
        }
        localStorage.setItem(REMINDER_STORAGE_KEY, JSON.stringify(stored));
        reminders = stored;
      } catch (e) {}
      closeReminderNotification();
      setTimeout(checkRemindersDue, 500);
      renderReminderPreview();
    }

    function checkRemindersDue() {
      try {
        const stored = JSON.parse(localStorage.getItem(REMINDER_STORAGE_KEY) || '[]');
        if (!Array.isArray(stored)) return;
        if (document.getElementById('reminderNotification') && document.getElementById('reminderNotification').classList.contains('open')) return;
        const now = Date.now();
        const due = stored.find(r => r.due && !r.alertShown && now >= r.due);
        if (due) showReminderNotification(due);
      } catch (e) {}
    }

    setInterval(() => { checkRemindersDue(); renderReminderPreview(); }, 30000);
    document.addEventListener('DOMContentLoaded', () => { checkRemindersDue(); renderReminderPreview(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { checkRemindersDue(); renderReminderPreview(); }
    });

    window.openReminderModal = openReminderModal;
    window.closeReminderModal = closeReminderModal;
    window.saveReminderFromModal = saveReminderFromModal;
    window.handleReminderAction = handleReminderAction;

  </script>
